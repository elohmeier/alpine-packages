[env]
# melange reads none of its flags from MELANGE_*-style env vars, so the local
# defaults (signing key, local repo, pipeline dir, qemu runner) live in the
# build and test tasks instead.
#
# env.sh exports MELANGE_ARCH — the one architecture knob, consumed by those
# tasks — plus the QEMU_* paths that melange's qemu runner does read from the
# environment. mise does not expose env keys of this table to sourced scripts,
# so the architecture is defined there and not here.
_.source = [".mise/env.sh"]
