package:
  name: redsea
  version: "1.3.1"
  epoch: 0
  description: "Command-line FM-RDS decoder with JSON output"
  copyright:
    - license: MIT
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - liquid-dsp
  target-architecture:
    - x86_64
    - aarch64
  checks:
    disabled:
      - usrmerge

environment:
  contents:
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    packages:
      - busybox
      - build-base
      - ca-certificates
      - libsndfile-dev
      - liquid-dsp
      - liquid-dsp-dev
      - meson
      - ninja
      - nlohmann-json
      - pkgconf

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/windytan/redsea.git
      tag: v${{package.version}}
      expected-commit: 4cc27df9939798e800c4ff7cb484be6d9bf68b4d

  - runs: |
      meson setup build \
        --prefix=/usr \
        --buildtype=release \
        --wrap-mode=nodownload \
        -Dbuild_tests=false
      meson compile -C build
      DESTDIR="${{targets.destdir}}" meson install -C build

  - uses: strip

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      keyring:
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
      packages:
        - busybox
  pipeline:
    - runs: redsea --version | grep -Fx "redsea ${{package.version}} by OH2EIQ"
    - runs: |
        output=$(printf '%s\n' \
          '001' \
          '1110110110111010011100010101001000010100001110000010' \
          '0010001011100001011100110000100101100000111100111110' \
          '0010000001100101101101001101101001001000000110111110' \
          '0010001011100001011100110000000101100010010011100000' \
          '1010011010110011111010010101010011010011000101010101' \
          '0010001011100001011100110000100101100001001010101000' \
          '0111001101100001010000011001100001000011010111000111' \
          '001000' | redsea --input bits)
        printf '%s\n' "$output" | grep -F \
          '{"pi":"0x22E1","group":"2A","tp":true,"prog_type":"Easy listening"}'
