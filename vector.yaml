package:
  name: vector
  version: "0.57.0"
  epoch: 1
  description: "High-performance observability data pipeline"
  copyright:
    - license: MPL-2.0
  target-architecture:
    - aarch64
    - x86_64
  dependencies:
    runtime:
      - libgcc
      - librdkafka
      - cyrus-sasl-gssapiv2
      - krb5-libs
  scriptlets:
    pre-install: |
      #!/bin/sh
      addgroup -S vector 2>/dev/null
      adduser -S -D -h /var/lib/vector -s /sbin/nologin -G vector -g vector vector 2>/dev/null
      adduser vector adm 2>/dev/null
      exit 0
    post-upgrade: |
      #!/bin/sh
      # Pick up initd/wrapper fixes automatically on upgrade.
      if rc-service vector status >/dev/null 2>&1; then
        rc-service vector restart
      fi
      exit 0
  checks:
    disabled:
      - usrmerge

environment:
  contents:
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates
      - cargo
      - clang-dev
      - cmake
      - cyrus-sasl-dev
      - krb5-dev
      - librdkafka-dev
      - openssl-dev
      - perl
      - protobuf-dev
      - protoc
      - python3
      - rust
  environment:
    OPENSSL_NO_VENDOR: "1"
    CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/vectordotdev/vector.git
      tag: v${{package.version}}
      expected-commit: 8832452f57afb536ea0de53a093f9fd1b669ccec

  - runs: |
      # Patch Cargo.toml to use system rdkafka with dynamic linking and system gssapi
      # This avoids building vendored krb5 which has GCC compatibility issues
      sed -i 's/rdkafka?\/cmake_build/rdkafka?\/dynamic-linking/g' Cargo.toml
      sed -i 's/rdkafka?\/gssapi-vendored/rdkafka?\/gssapi/g' Cargo.toml

      # Fetch dependencies - allow lock file update for the rdkafka changes
      cargo fetch

  - runs: |
      cargo build \
        --release \
        --frozen \
        --no-default-features \
        --features default-musl

      install -Dm755 target/release/vector "${{targets.destdir}}"/usr/bin/vector

  - runs: |
      # Install default config
      install -Dm644 config/vector.yaml "${{targets.destdir}}"/etc/vector/vector.yaml

      # Install logrotate config
      install -Dm644 vector/logrotate "${{targets.destdir}}"/etc/logrotate.d/vector

      # Install OpenRC files + the run wrapper (loads /etc/vector/vector.env
      # after the privilege drop; see vector/vector-run)
      install -Dm755 vector/vector.initd "${{targets.destdir}}"/etc/init.d/vector
      install -Dm644 vector/vector.confd "${{targets.destdir}}"/etc/conf.d/vector
      install -Dm755 vector/vector-run "${{targets.destdir}}"/usr/libexec/vector/vector-run

      # Create data directory
      install -dm755 "${{targets.destdir}}"/var/lib/vector

  - uses: strip

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      keyring:
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
      packages:
        - busybox
        - libgcc
        - librdkafka
        - cyrus-sasl-gssapiv2
        - krb5-libs
  pipeline:
    - runs: |
        vector --version
        vector --help
    - runs: |
        # Regression guards for the OpenRC integration (see vector/vector-run).
        test -x /usr/libexec/vector/vector-run
        test -x /etc/init.d/vector
        # wrapper must default to the yaml config, not vector's toml default
        grep -q 'VECTOR_CONFIG:-/etc/vector/vector.yaml' /usr/libexec/vector/vector-run
        # start_pre must not validate a hardcoded .toml that a yaml install lacks
        ! grep -q 'validate /etc/vector/vector.toml' /etc/init.d/vector
        # the wrapper sources the runtime env after the privilege drop
        grep -q '/etc/vector/vector.env' /usr/libexec/vector/vector-run
