package:
  name: ftp-paperless-bridge
  version: "0.4.0"
  epoch: 0
  description: "FTP/SFTP server bridge for network document scanners to paperless-ngx"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openrc
  target-architecture:
    - x86_64
    - aarch64
  checks:
    disabled:
      - usrmerge
  scriptlets:
    pre-install: |
      #!/bin/sh
      addgroup -S paperless 2>/dev/null || true
      adduser -S -D -H -h /nonexistent -s /sbin/nologin -G paperless -g paperless paperless 2>/dev/null || true
      exit 0
    post-install: |
      #!/bin/sh
      echo ""
      echo "=== ftp-paperless-bridge installed ==="
      echo ""
      echo "Quick start:"
      echo "  1. Edit /etc/conf.d/ftp-paperless-bridge"
      echo "     - Set FTP_PAPERLESS_BRIDGE_PAPERLESS_URL"
      echo "     - Set FTP_PAPERLESS_BRIDGE_PAPERLESS_API_TOKEN"
      echo "     - Change FTP_PAPERLESS_BRIDGE_PASSWORD"
      echo "     - Enable FTP and/or SFTP listeners"
      echo "  2. rc-service ftp-paperless-bridge start"
      echo "  3. rc-update add ftp-paperless-bridge default"
      echo ""
      echo "Ports:"
      echo "  2121       FTP server"
      echo "  2122-2124  FTP passive mode"
      echo "  2222       SFTP server (when enabled)"
      echo ""
      echo "Logs:"
      echo "  /var/log/ftp-paperless-bridge.log"
      echo ""
    post-upgrade: |
      #!/bin/sh
      if rc-service ftp-paperless-bridge status >/dev/null 2>&1; then
        rc-service ftp-paperless-bridge restart
      fi

environment:
  contents:
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/edge/main
      - https://dl-cdn.alpinelinux.org/alpine/edge/community
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates
      - cargo
      - openssl-dev
      - rust
  environment:
    CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/elohmeier/ftp-paperless-bridge.git
      branch: main
      expected-commit: fae5a874d1125f164c0bebf85ea19a1bc925a467

  - runs: |
      cargo fetch --locked

  - runs: |
      cargo build --release --frozen

      install -Dm755 target/release/${{package.name}} \
        "${{targets.destdir}}"/usr/bin/${{package.name}}

  - uses: strip

  - runs: |
      install -Dm755 ftp-paperless-bridge/ftp-paperless-bridge.initd \
        "${{targets.destdir}}"/etc/init.d/ftp-paperless-bridge
      install -Dm644 ftp-paperless-bridge/ftp-paperless-bridge.confd \
        "${{targets.destdir}}"/etc/conf.d/ftp-paperless-bridge

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/edge/main
        - https://dl-cdn.alpinelinux.org/alpine/edge/community
      keyring:
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
      packages:
        - busybox
        - openrc
  pipeline:
    - runs: |
        ftp-paperless-bridge --version | grep -q '${{package.version}}'
        ftp-paperless-bridge --help
    - runs: |
        test -x /etc/init.d/ftp-paperless-bridge
        test -x /sbin/openrc-run
        grep -q '^supervisor=supervise-daemon$' /etc/init.d/ftp-paperless-bridge
        grep -q -- '--respawn-delay 10 --respawn-max 0' /etc/init.d/ftp-paperless-bridge
        grep -q 'FTP_PAPERLESS_BRIDGE_SFTP_LISTEN' /etc/init.d/ftp-paperless-bridge
        grep -q 'FTP_PAPERLESS_BRIDGE_SFTP_LISTEN' /etc/conf.d/ftp-paperless-bridge
        grep -q 'FTP_PAPERLESS_BRIDGE_SFTP_HOST_KEY' /etc/conf.d/ftp-paperless-bridge
        if grep -q '^command_background=' /etc/init.d/ftp-paperless-bridge; then
          exit 1
        fi
        if grep -q '^pidfile=' /etc/init.d/ftp-paperless-bridge; then
          exit 1
        fi
        sh -n /etc/init.d/ftp-paperless-bridge
